# Runs on every push and pull request. GitHub gives us a fresh Ubuntu machine;
# whatever passes here passes from a clean checkout.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the code onto the fresh machine.
      - uses: actions/checkout@v4

      # 2. Install uv (the official action handles caching too).
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Pin the Python your project targets. If you pinned 3.12 locally,
          # match it here. Using 3.12 in CI is safe even if you run 3.14
          # locally, but keep them the same to avoid surprises.
          python-version: "3.12"

      # 3. Install the project and dev dependencies into a clean venv.
      - name: Install dependencies
        run: uv sync --dev

      # 4. Lint. Fails the build on style/error violations.
      - name: Ruff
        run: uv run ruff check .

      # 5. Unit tests for the extractors.
      - name: Pytest
        run: uv run pytest

      # 6. dbt: download packages, then build against the sample fixture Delta
      #    tables instead of real bronze (which is not in Git). The --vars
      #    flag overrides the source path; see the staging model change.
      #    profiles.yml's `extensions: [delta]` downloads and loads DuckDB's
      #    delta extension on connect, needs the network access GitHub-
      #    hosted runners already have, no extra CI step required.
      - name: dbt deps
        working-directory: dbt
        run: uv run dbt deps

      - name: Create data directory for DuckDB
        run: mkdir -p data

      - name: dbt build (against fixtures)
        working-directory: dbt
        run: |
          uv run dbt build --vars '{carbon_intensity_path: ../tests/fixtures/carbon_intensity, carbon_intensity_regional_mix_path: ../tests/fixtures/carbon_intensity_regional_mix, elexon_system_prices_path: ../tests/fixtures/elexon_system_prices, elexon_generation_by_fuel_path: ../tests/fixtures/elexon_generation_by_fuel}'
    env:
      TARGET: local
      LOCAL_DATA_ROOT: tests/fixtures

  # Everything above runs cloud-free, on every push and every PR, including
  # ones from forks. This job is different: it authenticates to the real
  # Azure subscription, so it runs on push to main only, never on
  # pull_request. A fork's PR runs with that PR's own (possibly modified)
  # workflow file, so granting cloud credentials on pull_request would let
  # any external contributor author a step that uses them. Push to main
  # only runs code that has already been merged, already trusted. See
  # infra/terraform/main.tf for the federated identity credential this
  # authenticates through: no client secret exists anywhere for this to
  # leak, on either side.
  azure:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # id-token: write is what lets GitHub mint the OIDC token azure/login
    # exchanges for an Azure access token. Nothing works without it.
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC, no client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # Terraform runs early in this job, before dbt, on purpose: dbt
      # needs to know which storage account to read, and that name is not
      # something to hardcode here or duplicate into a 4th GitHub secret
      # kept in sync by hand. It changes on every `make teardown` +
      # reapply (see variables.tf / journal), and a hardcoded or
      # manually-updated copy would go stale exactly the way
      # AZURE_CLIENT_ID already did earlier today. Terraform state is the
      # one real source of truth for this value, so CI reads it from
      # there, same as everything else in this project that touches
      # Azure resource names.
      #
      # subscription_id is a required variable with no default (see
      # variables.tf); locally it comes from terraform.tfvars, which is
      # gitignored on purpose and so doesn't exist on this runner.
      # TF_VAR_subscription_id supplies it here from the same secret
      # azure/login already used above.
      - name: terraform init
        working-directory: infra/terraform
        run: terraform init
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Read Azure resource names from Terraform state
        working-directory: infra/terraform
        run: |
          echo "AZURE_STORAGE_ACCOUNT_NAME=$(terraform output -raw storage_account_name)" >> "$GITHUB_ENV"
          echo "AZURE_STORAGE_CONTAINER=$(terraform output -raw container_name)" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: dbt deps
        working-directory: dbt
        run: uv run dbt deps

      # DuckDB doesn't create the parent directory for its database file,
      # only the file itself. A fresh checkout has no data/ at all, so
      # opening lakehouse_azure.duckdb fails outright without this. The
      # build job needs the equivalent step for the same reason; this job
      # doesn't share that job's filesystem, so it needs its own.
      - name: Create data directory for DuckDB
        run: mkdir -p data

      # Validates the real Azure read path: delta_scan() through the
      # azure extension, credentialed via CHAIN 'cli' the same way the
      # local Azure CLI login is (see profiles.yml), except here the
      # "CLI login" is azure/login's OIDC exchange above, not a person's
      # `az login` session. Same 56 tests that already run locally.
      # AZURE_STORAGE_ACCOUNT_NAME / AZURE_STORAGE_CONTAINER come from the
      # step above, already in the job environment by this point.
      - name: dbt build (against real Azure bronze)
        working-directory: dbt
        run: uv run dbt build --target azure
        env:
          TARGET: azure

      # Read-only: catches infra drift or a bad infra/terraform/ change
      # after merge. Runs every time rather than only when infra/terraform/
      # changed: simpler CI config, and a plan against unchanged config
      # is a fast, free no-op, so there is little to gain from gating it.
      - name: terraform plan
        working-directory: infra/terraform
        run: terraform plan -no-color
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}