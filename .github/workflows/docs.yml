# Publishes two things to the same GitHub Pages site: dbt's generated
# documentation (lineage graph + column-level catalog), and the public
# data product's JSON files (api/*.json, see
# lakehouse.products.api_export and README.md's "The public data
# product"). The docs half builds against the same committed fixtures as
# CI's build job, deliberately: publishing docs never needs Azure
# credentials, for the same reason ci.yml's build job doesn't. See that
# file's own comments. `dbt run` happens before `docs generate` on
# purpose too: docs generate alone only produces the lineage graph with
# no column-level detail, because there is no warehouse to read a
# catalog from yet.
#
# api/*.json is different: those files are NOT generated by this
# workflow. data_product_job (lakehouse.dagster_defs.products) runs on
# this project's own machine against real gold, then commits and pushes
# api/*.json straight into the repo -- so by the time this workflow runs
# (triggered by that very push), the real files are already sitting in
# the checkout, just waiting to be copied into the published site
# alongside the docs. This workflow only ever republishes whatever the
# latest push already committed; it does not, and cannot, regenerate
# them itself (no real gold to read from here, same reason the docs half
# uses fixtures instead of real data).

name: Publish dbt docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET: local
      LOCAL_DATA_ROOT: tests/fixtures

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: dbt deps
        working-directory: dbt
        run: uv run dbt deps

      - name: Create data directory for DuckDB
        run: mkdir -p data

      # seed + run + snapshot + run again (not build): tests aren't
      # needed to produce docs, and skipping them keeps this workflow
      # from being a second place a data-quality failure can block a
      # docs publish. CI's own build job is still what gates merges.
      #
      # run appears twice, deliberately, not a copy-paste mistake:
      # snapshot_connection_queue.sql selects from stg_neso_connections,
      # a view `dbt run` creates, so snapshotting before the first run
      # fails outright ("stg_neso_connections does not exist"). But
      # fct_connection_queue and mart_queue_evolution both ref() the
      # snapshot, so the first run, before the snapshot exists yet,
      # fails on those two just as outright. `dbt build` sidesteps this
      # by interleaving snapshots and models in one real DAG order; two
      # separate top-level commands don't share that interleaving with
      # each other, so the run has to happen twice, framing the
      # snapshot in the middle: once to produce what the snapshot reads,
      # once to produce what reads the snapshot. Both failure modes were
      # hit for real, in this order, before landing on this sequence.
      - name: dbt seed (fixtures)
        working-directory: dbt
        run: |
          uv run dbt seed --vars '{carbon_intensity_path: ../tests/fixtures/carbon_intensity, carbon_intensity_regional_mix_path: ../tests/fixtures/carbon_intensity_regional_mix, elexon_system_prices_path: ../tests/fixtures/elexon_system_prices, elexon_generation_by_fuel_path: ../tests/fixtures/elexon_generation_by_fuel, neso_connections_path: ../tests/fixtures/neso_connections}'

      - name: dbt run (fixtures)
        working-directory: dbt
        run: |
          uv run dbt run --vars '{carbon_intensity_path: ../tests/fixtures/carbon_intensity, carbon_intensity_regional_mix_path: ../tests/fixtures/carbon_intensity_regional_mix, elexon_system_prices_path: ../tests/fixtures/elexon_system_prices, elexon_generation_by_fuel_path: ../tests/fixtures/elexon_generation_by_fuel, neso_connections_path: ../tests/fixtures/neso_connections}' --exclude fct_connection_queue+

      - name: dbt snapshot (fixtures)
        working-directory: dbt
        run: |
          uv run dbt snapshot --vars '{carbon_intensity_path: ../tests/fixtures/carbon_intensity, carbon_intensity_regional_mix_path: ../tests/fixtures/carbon_intensity_regional_mix, elexon_system_prices_path: ../tests/fixtures/elexon_system_prices, elexon_generation_by_fuel_path: ../tests/fixtures/elexon_generation_by_fuel, neso_connections_path: ../tests/fixtures/neso_connections}'

      - name: dbt run, second pass, for models that depend on the snapshot (fixtures)
        working-directory: dbt
        run: |
          uv run dbt run --vars '{carbon_intensity_path: ../tests/fixtures/carbon_intensity, carbon_intensity_regional_mix_path: ../tests/fixtures/carbon_intensity_regional_mix, elexon_system_prices_path: ../tests/fixtures/elexon_system_prices, elexon_generation_by_fuel_path: ../tests/fixtures/elexon_generation_by_fuel, neso_connections_path: ../tests/fixtures/neso_connections}' --select fct_connection_queue+

      - name: dbt docs generate
        working-directory: dbt
        run: uv run dbt docs generate --static

      - name: Stage site
        run: |
          mkdir -p site
          cp dbt/target/static_index.html site/index.html

      # api/ may not exist yet (before data_product_job's first real
      # run has ever committed anything): `2>/dev/null || true` makes
      # that a quiet no-op rather than a failed step, the same as any
      # other "this is allowed to not exist yet" case in this project.
      - name: Stage the public data product JSON
        run: |
          mkdir -p site/api
          cp api/*.json site/api/ 2>/dev/null || echo "No api/*.json committed yet, nothing to stage."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
