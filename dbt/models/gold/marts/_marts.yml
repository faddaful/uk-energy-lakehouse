# Tests for the gold marts. Filename: _marts.yml, sits next to the three
# mart .sql files in models/gold/marts/.

version: 2

models:
  - name: mart_daily_summary
    description: >
      One row per calendar day: price, generation mix, and carbon
      intensity, shaped for a dashboard's daily overview.
      is_price_complete lets the dashboard grey out a day that is still
      partial rather than plotting it as final.
    columns:
      - name: date_key
        description: Foreign key to dim_date.date_key, one row per day, so also unique here.
        tests: [not_null, unique]
      - name: date_day
        description: The calendar date this row summarises.
        tests: [not_null, unique]
      - name: renewable_share_pct
        description: >
          Renewable MWh as a share of total generation MWh for the day.
          Inherits the same net-mix caveat as fct_generation.share_of_mix_pct.

  - name: mart_best_hours_today
    description: >
      The next 24 hours for the home region (West Midlands, region_id 8),
      ranked by forecast carbon intensity and, where a real settled price
      exists, by price. Rebuilt fresh on every dbt run, see
      generated_at.
    columns:
      - name: half_hour_start_utc
        description: Start of the half hour this row ranks, UTC.
        tests: [not_null, unique]
      - name: greenness_rank
        description: 1 = lowest forecast carbon intensity in the next 24 hours.
        tests: [not_null]
      - name: generated_at
        description: >
          When this mart was last built. Not decorative: the Streamlit
          app should show it next to every figure this mart produces, so
          staleness is visible rather than assumed away.
        tests: [not_null]

  - name: mart_queue_evolution
    description: >
      One row per calendar month: connections-queue size, capacity mix
      by technology category, and how far NESO's own published
      connection dates moved since the previous month. See the model
      comment for exactly what connection_date_slippage_days measures
      and why a project's first observed month never has one.
    columns:
      - name: as_of_month
        description: First day of the calendar month this row summarises.
        tests: [not_null, unique]
      - name: total_capacity_mw
        description: Sum of cumulative_capacity_mw across every project tranche in the queue that month.
        tests: [not_null]
      - name: renewable_share_of_generation_pct
        description: >
          renewable_capacity_mw as a percentage of generation_capacity_mw
          (excludes Interconnector/Demand/Reactive Compensation/
          Substation, see seed_neso_technology's is_generation).
      - name: avg_connection_date_slippage_days
        description: >
          Positive means published connection dates moved later on
          average that month (delay); negative means earlier. NULL until
          a second monthly landing exists to compare against, see the
          model comment.

  - name: mart_revision_summary
    description: >
      One row per settlement month: how often Elexon's published system
      prices changed after first publication, and by how much.
      pct_periods_revised is the headline "how often are the published
      numbers wrong" figure. See the model comment for why this covers
      price revisions only, not generation revisions.
    columns:
      - name: settlement_month
        description: First day of the calendar month this row summarises.
        tests: [not_null, unique]
      - name: pct_periods_revised
        description: >
          revision_count as a percentage of total_periods for the month.
          Expected to be small most months, see the model comment.

  - name: mart_greenest_hours_next_48h
    description: >
      The next 48 hours for the home region (West Midlands, region_id
      8), ranked by forecast carbon intensity and, where a real settled
      price exists, by price. Exported as greenest_hours_next_48h.json,
      see lakehouse.products.api_export and the model comment for why
      this is a separate mart from mart_best_hours_today rather than a
      shared, parametrised one.
    columns:
      - name: half_hour_start_utc
        description: Start of the half hour this row ranks, UTC.
        tests: [not_null, unique]
      - name: greenness_rank
        description: 1 = lowest forecast carbon intensity in the next 48 hours.
        tests: [not_null]
      - name: generated_at
        description: When this mart was last built. Published in the exported JSON as the product's own freshness marker.
        tests: [not_null]

  - name: mart_latest_price_anomalies
    description: >
      Settlement periods in the last 30 days with a negative system sell
      price, or a swing of £50/MWh or more from the period immediately
      before. Exported as latest_price_anomalies.json, see
      lakehouse.products.api_export and the model comment for how this
      relates to the Streamlit dashboard's own, separate version of the
      same idea.
    columns:
      - name: settlement_period_start_utc
        description: Start of the settlement period this row flags, UTC.
        tests: [not_null, unique]
      - name: anomaly_type
        description: Why this period was flagged.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["negative_price", "large_swing"]
      - name: generated_at
        description: When this mart was last built.
        tests: [not_null]

  - name: mart_tariff_comparison
    description: >
      One row per hand-logged usage period: would Octopus Agile have
      cost less than what you actually paid, for the electricity you
      actually used. See the model comment for the real approximation
      this makes (period-level day/night averages, not true half-hourly
      consumption) and why estimated_cost_gbp, not a reconstruction of
      your current tariff, is the baseline it compares against.
    columns:
      - name: period_start
        tests: [not_null]
      - name: period_end
        tests: [not_null]
      - name: agile_equivalent_cost_gbp
        description: What the same day_kwh/night_kwh would have cost on Agile's average day/night rates for this period.
      - name: agile_savings_gbp
        description: actual_estimated_cost_gbp minus agile_equivalent_cost_gbp. Positive means Agile would have been cheaper.
      - name: is_complete
        description: >
          False when Agile price history doesn't yet cover the whole
          period (e.g. a period logged before prices were backfilled
          that far back). A consumer should treat agile_equivalent_cost_gbp
          as partial, not wrong, when this is false.
        tests: [not_null]
      - name: generated_at
        description: When this mart was last built.
        tests: [not_null]
