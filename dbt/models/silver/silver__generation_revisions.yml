# Tests for the silver model. Filename: silver__generation_revisions.yml,
# sits next to the .sql file in models/silver/.

version: 2

models:
  - name: silver__generation_revisions
    description: >
      Audit log of every generation-by-fuel value change observed in
      bronze for a settlement_date + settlement_period + fuel_type: one
      row per change, with the old value, the new value, and when the new
      value was first seen.
    columns:
      - name: settlement_date
        tests:
          - not_null
      - name: settlement_period
        tests:
          - not_null
      - name: fuel_type
        tests:
          - not_null
      - name: old_generation_mw
        tests:
          - not_null
      - name: new_generation_mw
        tests:
          - not_null
      - name: revised_at
        description: loaded_at of the landing that introduced the new value.
        tests:
          - not_null
