# Tests for the silver model. Filename: silver__generation_by_fuel.yml,
# sits next to the .sql file in models/silver/.

version: 2

models:
  - name: silver__generation_by_fuel
    description: >
      One row per settlement_date + settlement_period + fuel_type,
      resolved to the latest loaded_at seen in bronze.
    tests:
      # Exactly one resolved row per key: the core correctness property
      # of the resolution logic.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - settlement_date
              - settlement_period
              - fuel_type
    columns:
      - name: settlement_date
        tests:
          - not_null
      - name: settlement_period
        tests:
          - not_null
      - name: fuel_type
        tests:
          - not_null
      - name: generation_mw
        description: >
          FUELHH's fuel_type values are not all "a generator producing
          power": INT* is interconnector flow (negative means GB is
          exporting, not importing) and PS is pumped storage (negative
          means it is pumping/charging, not generating). Both are real,
          expected values, confirmed against 90 days of real backfilled
          data, not assumed. Everything else is a true generator and
          cannot legitimately be negative. Checked as two separately
          scoped range tests below rather than one loose bound, so a
          genuine generator going negative (a real bug) still fails
          loudly instead of being masked by the interconnector/PS margin.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              config:
                where: "fuel_type not like 'INT%' and fuel_type != 'PS'"
              arguments:
                min_value: 0
                max_value: 50000
          - dbt_expectations.expect_column_values_to_be_between:
              config:
                where: "fuel_type like 'INT%' or fuel_type = 'PS'"
              arguments:
                min_value: -3000
                max_value: 3000
      - name: loaded_at
        tests:
          - not_null
