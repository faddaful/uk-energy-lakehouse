# Tests for the silver model. Filename: silver__carbon_intensity_regional_mix.yml,
# sits next to the .sql file in models/silver/.

version: 2

models:
  - name: silver__carbon_intensity_regional_mix
    description: >
      One row per half hour + region + fuel, deduplicated to the latest
      loaded_at. The trustworthy layer downstream models build on.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - valid_from
              - region_id
              - ci_fuel_code
    columns:
      - name: valid_from
        tests:
          - not_null
      - name: region_id
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [8,13]
                quote: false
      - name: ci_fuel_code
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('seed_ci_fuel_type')
                field: ci_fuel_code
      - name: mix_pct
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
