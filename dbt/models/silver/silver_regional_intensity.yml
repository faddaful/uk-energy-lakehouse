# Tests for the silver model. Filename: silver__regional_intensity.yml,
# sits next to the .sql file in models/silver/.

version: 2

models:
  - name: silver_regional_intensity
    description: >
      One row per half hour per region, deduplicated to the latest
      loaded_at. The trustworthy layer downstream models build on.
    tests:
      # Uniqueness of a COMBINATION of columns needs dbt_utils; the plain
      # `unique` test only works on a single column.
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - valid_from
            - region_id
    columns:
      - name: valid_from
        tests:
          - not_null
      - name: region_id
        tests:
          - not_null
          # Your extractor fetches one region, so pin it. Widen this list
          # if you ever ingest more regions.
          - accepted_values:
              arguments:
                values: [8,13]
                quote: false
      - name: intensity_forecast
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1500