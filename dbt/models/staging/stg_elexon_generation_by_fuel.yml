# Tests for the staging model. Filename: stg_elexon_generation_by_fuel.yml,
# sits next to the .sql file in models/staging/.

version: 2

models:
  - name: stg_elexon_generation_by_fuel
    description: >
      Bronze Elexon generation-by-fuel-type parquet, typed and renamed.
      Contains every past landing for a settlement_date + settlement_period
      + fuel_type, not just the latest: bronze is append-only for Elexon.
      Resolution to one row happens in silver.
    columns:
      - name: settlement_date
        tests:
          - not_null
      - name: settlement_period
        tests:
          - not_null
      - name: fuel_type
        description: e.g. CCGT, WIND, NUCLEAR, BIOMASS.
        tests:
          - not_null
      - name: generation_mw
        tests:
          - not_null
      - name: loaded_at
        description: When this particular landing was fetched. Not unique
          per settlement_date + settlement_period + fuel_type, by design.
        tests:
          - not_null
