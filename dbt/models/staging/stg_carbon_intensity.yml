# Tests for the staging model. Filename: stg_carbon_intensity.yml,
# sits next to the .sql file in models/staging/.

version: 2

models:
  - name: stg_carbon_intensity
    description: >
      Bronze carbon intensity parquet, typed and renamed. May contain
      duplicates per half hour; deduplication happens in silver.
    columns:
      - name: valid_from
        description: Start of the half-hour window (UTC).
        tests:
          - not_null
      - name: region_id
        description: Carbon Intensity API region ID (1 to 18).
        tests:
          - not_null
      - name: intensity_index
        description: >
          The API's own qualitative band for intensity_forecast (e.g.
          "low", "moderate", "high") -- not derived here, carried through
          exactly as the API reports it. Its numeric thresholds are not
          published anywhere this project found, so this is the only
          source of that classification; do not try to recompute it from
          intensity_forecast.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["very low", "low", "moderate", "high", "very high"]
      - name: loaded_at
        description: When the extractor landed this row.
        tests:
          - not_null