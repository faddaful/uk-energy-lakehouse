[project]
name = "lakehouse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ibraheem Olayanju", email = "olayanjuibraheem1@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dagster>=1.13.16",
    "dagster-webserver>=1.13.16",
    "dbt-core>=1.12.0",
    "dbt-duckdb>=1.10.1",
    "duckdb>=1.5.5",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "requests>=2.34.2",
]

[project.scripts]
lakehouse = "lakehouse:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
