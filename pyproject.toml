[project]
name = "lakehouse"
version = "0.1.0"
description = "UK Energy Market Lakehouse"
readme = "README.md"
authors = [
    { name = "Ibraheem Olayanju", email = "olayanjuibraheem1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "adlfs>=2026.8.0",
    "azure-identity>=1.25.3",
    "dagster>=1.13.16",
    "dagster-webserver>=1.13.16",
    "dbt-core>=1.12.0",
    "dbt-duckdb>=1.10.1",
    "deltalake>=1.6.2",
    "duckdb>=1.5.5",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    # Capped below 24: pyarrow 24/25 segfault inside Streamlit's dataframe
    # serialisation the second time any script that calls st.dataframe (or
    # st.plotly_chart, which hits the same path) reruns in one process --
    # reproduced down to a two-line repro with no pandas/duckdb involved at
    # all, and confirmed gone on every version from 20.0.0 through 23.0.1.
    # Not a version anyone chose on purpose; revisit the cap once a
    # pyarrow/Streamlit release fixes it upstream.
    "pyarrow>=23.0.1,<24",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "streamlit>=1.59.1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.dagster]
module_name = "lakehouse.dagster_defs.definitions"
